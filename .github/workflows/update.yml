name: Update FreePhase rates

on:
  schedule:
    # Roll "today" forward shortly after midnight
    - cron: "30 0 * * *"
    # Multiple attempts during EDF's midday publication window.
    # GitHub free-tier scheduled workflows are delayed by hours under load;
    # listing several entries maximises the chance one lands close to EDF publish time.
    - cron: "0 11 * * *"
    - cron: "30 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    # Intraday refreshes so the band cards self-heal if EDF revises rates after the
    # early-morning snapshot. Without these, today's amber/red can stay stuck on the
    # day-ahead provisional value all day even when the real rates have changed.
    # All UTC -> these land at 07/09/11/13/15/17/19/21 BST in summer.
    - cron: "0 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 18 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Fetch rates
        run: |
          set -euo pipefail

          API="https://api.edfgb-kraken.energy/v1/products/EDF_FREEPHASE_DYNAMIC_12M_HH/electricity-tariffs/E-1R-EDF_FREEPHASE_DYNAMIC_12M_HH-E/standard-unit-rates/"

          # EDF publishes its band windows in UK local time (BST/GMT):
          #   Green  23:00 - 06:00
          #   Amber  06:00 - 16:00 AND 19:00 - 23:00
          #   Red    16:00 - 19:00
          # Compute dates and boundaries in Europe/London, then convert to UTC for the API filter.
          TODAY=$(TZ=Europe/London date +"%Y-%m-%d")
          TOMORROW=$(TZ=Europe/London date -d "+1 day" +"%Y-%m-%d")
          YESTERDAY=$(TZ=Europe/London date -d "yesterday" +"%Y-%m-%d")
          DAY_AFTER=$(TZ=Europe/London date -d "+2 days" +"%Y-%m-%d")

          # Convert "YYYY-MM-DD HH:MM" interpreted as Europe/London into a UTC ISO 8601 string
          to_utc() {
            TZ=UTC date -d "TZ=\"Europe/London\" $1" -u +"%Y-%m-%dT%H:%M:%SZ"
          }

          PERIOD_FROM="$(to_utc "$YESTERDAY 00:00")"
          PERIOD_TO="$(to_utc "$DAY_AFTER 23:59")"

          # Fetch with retries; abort the step (preserving existing data.json on main) if EDF is still unhealthy
          HTTP=$(curl -s -o raw.json -w '%{http_code}' --retry 5 --retry-delay 6 --retry-all-errors --max-time 30 "${API}?period_from=${PERIOD_FROM}&period_to=${PERIOD_TO}" || echo 000)
          echo "EDF HTTP ${HTTP}"
          if [ "${HTTP}" != "200" ]; then
            echo "EDF returned HTTP ${HTTP}; preserving existing data.json and aborting step"
            exit 1
          fi
          if ! jq -e '.results' raw.json >/dev/null 2>&1; then
            echo "EDF response had no .results field; preserving existing data.json and aborting step"
            head -c 400 raw.json
            exit 1
          fi
          if [ "$(jq '.results | length' raw.json)" -eq 0 ]; then
            echo "EDF returned 0 results; preserving existing data.json and aborting step"
            exit 1
          fi

          # Average the half-hourly slots in one window, or in the union of two windows
          # (used for amber, which spans morning AND evening).
          # IMPORTANT: average over PAID slots only (value_inc_vat > 0) so the headline matches
          # the number EDF publishes on edfenergy.com — they report the paid-slot average too.
          # If we averaged across free slots as well (16 free + 12 paid at 3.72p), we'd report
          # ~1.59p, which isn't a price anyone ever actually pays. The free banner above the
          # card already tells users about the free window — no need to dilute the headline.
          extract_band() {
            local s1=$1
            local e1=$2
            local s2=${3:-}
            local e2=${4:-}

            jq -r --arg s1 "$s1" --arg e1 "$e1" --arg s2 "$s2" --arg e2 "$e2" '
              .results
              | map(select(
                  (.valid_from >= $s1 and .valid_from < $e1)
                  or ($s2 != "" and .valid_from >= $s2 and .valid_from < $e2)
                ))
              | if length == 0 then null else
                  (
                    . as $all
                    | ($all | map(select(.value_inc_vat > 0))) as $paid
                    | ($all | map(select(.value_inc_vat == 0))) as $free
                    | (if ($paid | length) == 0 then 0
                       else (($paid | map(.value_inc_vat) | add) / ($paid | length))
                       end) as $avg
                    | {
                        price: $avg,
                        start: ($all | map(.valid_from) | min),
                        end: ($all | map(.valid_to) | max),
                        paid_slots: ($paid | length),
                        free_slots: ($free | length),
                        band:
                          (if ($avg / 100) < 0.20 then "green"
                           elif ($avg / 100) < 0.30 then "amber"
                           else "red"
                          end)
                      }
                  )
                end
            ' raw.json
          }

          # UK-local band windows (converted to UTC for the API filter)
          GREEN_T_START=$(to_utc   "$YESTERDAY 23:00")
          GREEN_T_END=$(to_utc     "$TODAY 06:00")

          AMBER_T_M_START=$(to_utc "$TODAY 06:00")
          AMBER_T_M_END=$(to_utc   "$TODAY 16:00")
          AMBER_T_E_START=$(to_utc "$TODAY 19:00")
          AMBER_T_E_END=$(to_utc   "$TODAY 23:00")

          RED_T_START=$(to_utc     "$TODAY 16:00")
          RED_T_END=$(to_utc       "$TODAY 19:00")

          GREEN_TM_START=$(to_utc  "$TODAY 23:00")
          GREEN_TM_END=$(to_utc    "$TOMORROW 06:00")

          AMBER_TM_M_START=$(to_utc "$TOMORROW 06:00")
          AMBER_TM_M_END=$(to_utc   "$TOMORROW 16:00")
          AMBER_TM_E_START=$(to_utc "$TOMORROW 19:00")
          AMBER_TM_E_END=$(to_utc   "$TOMORROW 23:00")

          RED_TM_START=$(to_utc    "$TOMORROW 16:00")
          RED_TM_END=$(to_utc      "$TOMORROW 19:00")

          jq -n \
            --argjson tgreen  "$(extract_band "$GREEN_T_START"   "$GREEN_T_END")" \
            --argjson tamber  "$(extract_band "$AMBER_T_M_START" "$AMBER_T_M_END" "$AMBER_T_E_START" "$AMBER_T_E_END")" \
            --argjson tred    "$(extract_band "$RED_T_START"     "$RED_T_END")" \
            --argjson tmgreen "$(extract_band "$GREEN_TM_START"  "$GREEN_TM_END")" \
            --argjson tmamber "$(extract_band "$AMBER_TM_M_START" "$AMBER_TM_M_END" "$AMBER_TM_E_START" "$AMBER_TM_E_END")" \
            --argjson tmred   "$(extract_band "$RED_TM_START"    "$RED_TM_END")" \
            '{
              today: {
                green: $tgreen,
                amber: $tamber,
                red: $tred
              },
              tomorrow: {
                green: $tmgreen,
                amber: $tmamber,
                red: $tmred
              }
            }' > data.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data.json raw.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update prices"
            git pull --rebase origin main || true
            git push origin main
          fi
