name: Pi heartbeat

# Fails - so GitHub emails the owner - when something the night's charging depends on has stopped:
#  - the home Pi stops updating the dashboard (live_state more than 20 minutes old). Nothing on the Pi can report
#    its own death: a dead Pi means no 22:58 charger start and nothing watching the chargers. Added 2026-11-01.
#  - the BYD service stops reading the car while it is plugged in at home (byd_vehicle more than 75 minutes old):
#    it runs the 23:01 start and the night recovery. Added 2026-11-02.
#  - Supabase refuses the public key, a row is missing, or Supabase stays unreachable: the Pi and the BYD service
#    share their state through it. Added 2026-11-02 (it used to pass silently).
# GitHub runs this far less often than the schedule asks - every 5-10 hours (1-3 Nov 2026) - so the Pi's own
# healthchecks.io pings are the real alarm for a dead Pi; this stays mainly for Supabase access. So each problem is
# reported the first time a run sees it, then again 6 hours after the last report (audit 3 Nov, D4); when it began
# and when it was last reported are kept between runs in the Actions cache. The Pi re-enables this workflow weekly in
# case GitHub pauses it after 60 days without commits.

on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-heartbeat
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: index.html
          sparse-checkout-cone-mode: false
      - name: Restore when each problem began
        uses: actions/cache/restore@v4
        with:
          path: hb-state.json
          key: hb-state-${{ github.run_id }}
          restore-keys: hb-state-
      - name: Check the Pi, its BYD service and the data they share
        run: |
          python3 - <<'PY'
          import json, re, sys, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          NOW = datetime.now(timezone.utc)
          try:
              prev = json.load(open("hb-state.json"))
          except Exception:
              prev = {}
          if not isinstance(prev, dict):
              prev = {}
          REPEAT_S = 6 * 3600                               # a problem still there is reported again after this

          def earlier(kind):
              v = prev.get(kind)
              if isinstance(v, str):                        # the older format: when it began only
                  return {"began": v, "reported": None}
              return v if isinstance(v, dict) else {}

          problems = {}                                     # kind -> (minutes since it began, title, message, began)

          def remember(kind, title, message, since=None):
              began = since or datetime.fromisoformat(earlier(kind).get("began") or NOW.isoformat())
              problems[kind] = ((NOW - began).total_seconds() / 60, title, message, began)

          try:
              src = open("index.html", encoding="utf-8").read()
              url = re.search(r'const SUPABASE_URL\s*=\s*"([^"]+)"', src).group(1)
              key = re.search(r'const SUPABASE_KEY\s*=\s*"([^"]+)"', src).group(1)   # the public read key
          except Exception as e:
              print(f"::error title=Heartbeat check needs updating::Could not find the Supabase settings in "
                    f"index.html ({type(e).__name__}). This is the check itself, not the Pi.")
              sys.exit(1)
          headers = {"apikey": key}
          if key.count(".") == 2:                           # a legacy JWT key also goes as a bearer token
              headers["Authorization"] = "Bearer " + key

          def read(row):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(f"{url}/rest/v1/settings?key=eq.{row}&select=value", headers=headers)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          rows = json.load(r)
                      if not rows:
                          raise LookupError(f"the {row} row is missing or no longer readable with the public key")
                      v = rows[0]["value"]
                      return json.loads(v) if isinstance(v, str) else v
                  except urllib.error.HTTPError as e:
                      if e.code in (400, 401, 403, 404):
                          raise PermissionError(f"Supabase refused the public key (HTTP {e.code})")
                      last = e
                  except (LookupError, PermissionError):
                      raise
                  except Exception as e:
                      last = e
                  if attempt < 2:
                      time.sleep(20)
              raise ConnectionError(f"Supabase did not answer 3 tries ({type(last).__name__})")

          state = None
          try:
              state = read("live_state")
          except (PermissionError, LookupError) as e:
              remember("access", "Dashboard data unreadable",
                       f"{e}. The Pi and its BYD service share their state through Supabase, so the night's "
                       "charge-now and recovery may be off as well. A key may have been rotated, or Supabase's "
                       "legacy keys removed.")
          except ConnectionError as e:
              remember("supabase", "Supabase unreachable",
                       f"{e}. The Pi and its BYD service share their state through Supabase, so the night's "
                       "charge-now and recovery may be off while this lasts.")

          if state is not None:
              updated = datetime.fromisoformat(state["updated_at"])
              age = (NOW - updated).total_seconds() / 60
              print(f"Pi last published {age:.0f} min ago ({updated.isoformat()}).")
              if age >= 20:
                  remember("pi", "Home Pi offline",
                           f"The Pi has not updated the dashboard for {age:.0f} minutes. The Easee will not be "
                           "started at 22:58 and nothing is watching the chargers. Check the Pi has power and its "
                           "network connection; it also restarts itself every day at 13:03.", since=updated)
              op = (state.get("easee") or {}).get("op_mode")
              if age < 20 and op not in (None, 1):          # the BYD is plugged in at home
                  try:
                      byd = read("byd_vehicle")
                      checked = datetime.fromisoformat(byd["checked_at"])
                      byd_age = (NOW - checked).total_seconds() / 60
                      print(f"BYD service last read the car {byd_age:.0f} min ago.")
                      if byd_age >= 75:
                          remember("byd", "BYD service stopped",
                                   f"The BYD service has not read the car for {byd_age:.0f} minutes although it is "
                                   "plugged in at home. It runs the 23:01 start and the night recovery: check "
                                   "freephase-byd on the Pi.", since=checked)
                  except Exception as e:
                      remember("byd", "BYD service state unreadable",
                               f"Could not read the BYD service's state ({type(e).__name__}: {e}).")

          keep, alerted = {}, False
          for kind, (minutes, title, message, began) in problems.items():
              print(f"{title}: {message} (since {began.isoformat()}, {minutes:.0f} min)")
              reported = earlier(kind).get("reported")
              try:
                  due = reported is None or (NOW - datetime.fromisoformat(reported)).total_seconds() >= REPEAT_S
              except (TypeError, ValueError):
                  due = True
              if due:                                       # new to this check, or 6 hours since it was reported
                  print(f"::error title={title}::{message}")
                  alerted, reported = True, NOW.isoformat()
              keep[kind] = {"began": began.isoformat(), "reported": reported}
          json.dump(keep, open("hb-state.json", "w"))
          if not problems:
              print("All good: the Pi, its BYD service and Supabase are working.")
          sys.exit(1 if alerted else 0)
          PY
      - name: Remember when each problem began
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hb-state.json
          key: hb-state-${{ github.run_id }}
